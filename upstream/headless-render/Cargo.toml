[package]
name = "phira-render-headless"
version = "0.1.0"
edition = "2021"
rust-version = "1.60"
publish = false

[features]
default = ["headless-render"]
headless-render = []

[dependencies]
anyhow = { version = "1.0.70", features = ["backtrace"] }
macroquad = { git = "https://github.com/Mivik/prpr-macroquad", rev = "19119d6e3ec231502f6d64ff077114ffe1fcb04a", default-features = false }
prpr = { path = "../phira/prpr", default-features = false, features = ["headless"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8.0"
tokio = { version = "1.23", features = ["process", "rt-multi-thread", "fs"] }

[profile.release]
opt-level = 2

# Optional performance build for benchmark comparisons. Keep the default
# release profile unchanged until a representative visual/audio parity report
# accepts the optimized binary.
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
